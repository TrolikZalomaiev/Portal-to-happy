<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш киноблокнот 🎬</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff0f5; color: #333; max-width: 650px; margin: 40px auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #d81b60; margin-bottom: 25px; }
        
        /* Форма добавления */
        .form-group { display: flex; flex-direction: column; gap: 10px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; min-width: 200px; padding: 12px; border: 2px solid #f8bbd0; border-radius: 8px; outline: none; font-size: 16px; }
        input[type="text"]:focus { border-color: #d81b60; }
        select { padding: 12px; border: 2px solid #f8bbd0; border-radius: 8px; outline: none; font-size: 14px; background: white; color: #333; cursor: pointer; }
        button.add-btn { padding: 12px 20px; background: #d81b60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; font-size: 15px; }
        button.add-btn:hover { background: #c2185b; }
        
        /* Вкладки (фильтры) */
        .tabs { display: flex; gap: 8px; margin-bottom: 25px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { background: #fce4ec; color: #880e4f; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .tab-btn.active { background: #d81b60; color: white; box-shadow: 0 2px 5px rgba(216,27,96,0.3); }
        
        /* Список фильмов */
        .movie-list { display: flex; flex-direction: column; gap: 12px; }
        .movie-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: 0.2s; }
        .movie-item:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .movie-item.watched span.title { text-decoration: line-through; color: #999; }
        .movie-item.watched { opacity: 0.8; background: #fafafa; }
        
        /* Теги настроений */
        .tag { font-size: 11px; padding: 4px 10px; border-radius: 12px; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase; }
        .tag.Cozy { background: #fff9c4; color: #f57f17; }
        .tag.Romantic { background: #f8bbd0; color: #880e4f; }
        .tag.Comedy { background: #fff59d; color: #af5c00; }
        .tag.Action { background: #ffe0b2; color: #e65100; }
        .tag.Tense { background: #ffccbc; color: #d84315; }
        .tag.Drama { background: #e1bee7; color: #4a148c; }
        .tag.SciFi { background: #b3e5fc; color: #01579b; }
        
        .empty { text-align: center; color: #888; margin-top: 20px; font-style: italic; }
    </style>
</head>
<body>

    <h2>Наш киновечер 💖</h2>
    
    <div class="form-group">
        <div class="input-row">
            <input type="text" id="movieInput" placeholder="Введите название фильма..." onkeydown="if(event.key === 'Enter') addMovie()">
            <select id="moodSelect">
                <option value="Cozy">Уютный ☕</option>
                <option value="Romantic">Романтичный ❤️</option>
                <option value="Comedy">Смешной 😂</option>
                <option value="Action">Экшен 💥</option>
                <option value="Tense">Напряженный 🔥</option>
                <option value="Drama">Драма 🎭</option>
                <option value="SciFi">Фантастика 👽</option>
            </select>
        </div>
        <button class="add-btn" onclick="addMovie()">Добавить в список</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('all', this)">Все</button>
        <button class="tab-btn" onclick="switchTab('Cozy', this)">Уютные</button>
        <button class="tab-btn" onclick="switchTab('Romantic', this)">Романтика</button>
        <button class="tab-btn" onclick="switchTab('Comedy', this)">Комедии</button>
        <button class="tab-btn" onclick="switchTab('Action', this)">Экшен</button>
        <button class="tab-btn" onclick="switchTab('Tense', this)">Напряженные</button>
        <button class="tab-btn" onclick="switchTab('Drama', this)">Драма</button>
        <button class="tab-btn" onclick="switchTab('SciFi', this)">Фантастика</button>
    </div>

    <div id="movieList" class="movie-list"><div class="empty">Загрузка фильмов...</div></div>

<script>
    const SUPABASE_URL = 'https://moxqacnbytsoicvbztuz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_L0koDgGgN_EPAv4_QF1xvg_rt9NQUM7';
    
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let movies = [];
    let currentTab = 'all';

    async function fetchMovies() {
        try {
            const { data, error } = await db.from('movies').select('*').order('created_at', { ascending: false });
            if (error) {
                document.getElementById('movieList').innerHTML = `<p class="empty" style="color:red;">Ошибка загрузки: ${error.message}</p>`;
            } else {
                movies = data || [];
                renderMovies();
            }
        } catch (err) {
            document.getElementById('movieList').innerHTML = `<p class="empty" style="color:red;">Ошибка сети: ${err.message}</p>`;
        }
    }

    async function addMovie() {
        const input = document.getElementById('movieInput');
        const moodSelect = document.getElementById('moodSelect');
        const query = input.value.trim();
        
        if (!query) {
            alert('Сначала введите название фильма!');
            return;
        }

        const originalText = input.value;
        input.value = 'Добавление...';

        const { error } = await db.from('movies').insert([{ 
            title: query, 
            mood: moodSelect.value, 
            watched: false 
        }]);

        if (error) {
            alert('Ошибка при сохранении: ' + error.message);
            input.value = originalText;
        } else {
            input.value = ''; 
            fetchMovies();
        }
    }

    async function toggleWatched(id, currentStatus) {
        await db.from('movies').update({ watched: !currentStatus }).eq('id', id);
        fetchMovies();
    }

    async function deleteMovie(id) {
        await db.from('movies').delete().eq('id', id);
        fetchMovies();
    }

    function renderMovies() {
        const listContainer = document.getElementById('movieList');
        listContainer.innerHTML = '';

        const filtered = currentTab === 'all' ? movies : movies.filter(m => m.mood === currentTab);

        if (filtered.length === 0) {
            listContainer.innerHTML = '<p class="empty">В этой категории пока пусто ✨</p>';
            return;
        }

        filtered.forEach(movie => {
            const item = document.createElement('div');
            item.className = `movie-item ${movie.watched ? 'watched' : ''}`;
            
            // Здесь изменена структура: название и тег теперь идут колонкой
            item.innerHTML = `
                <label style="display: flex; align-items: center; gap: 15px; cursor: pointer; flex: 1;">
                    <input type="checkbox" ${movie.watched ? 'checked' : ''} onclick="toggleWatched('${movie.id}', ${movie.watched})" style="transform: scale(1.3); cursor: pointer;">
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <span class="title" style="font-size: 16px; font-weight: 600;">${movie.title}</span>
                        <span class="tag ${movie.mood}" style="align-self: flex-start;">${getMoodName(movie.mood)}</span>
                    </div>
                </label>
                <button onclick="deleteMovie('${movie.id}')" style="background: transparent; color: #ff5252; font-size: 20px; border:none; cursor:pointer; padding: 5px 10px; transition: 0.2s;" title="Удалить фильм">✕</button>
            `;
            listContainer.appendChild(item);
        });
    }

    function getMoodName(mood) {
        const moods = {
            Cozy: 'Уютный ☕',
            Romantic: 'Романтичный ❤️',
            Comedy: 'Смешной 😂',
            Action: 'Экшен 💥',
            Tense: 'Напряженный 🔥',
            Drama: 'Драма 🎭',
            SciFi: 'Фантастика 👽'
        };
        return moods[mood] || 'Другое';
    }

    function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMovies();
    }

    fetchMovies();
</script>

</body>
</html>
