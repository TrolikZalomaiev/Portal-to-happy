<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш киноблокнот 🎬</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff0f5; color: #333; max-width: 600px; margin: 40px auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #d81b60; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #f8bbd0; border-radius: 8px; outline: none; font-size: 16px; }
        input[type="text"]:focus { border-color: #d81b60; }
        button { padding: 12px 20px; background: #d81b60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #c2185b; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { background: #fce4ec; color: #880e4f; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .tab-btn.active { background: #d81b60; color: white; }
        .movie-list { display: flex; flex-direction: column; gap: 10px; }
        .movie-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .movie-item.watched span.title { text-decoration: line-through; color: #999; }
        .tag { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; }
        .tag.Cozy { background: #fff9c4; color: #f57f17; }
        .tag.Tense { background: #ffccbc; color: #d84315; }
        .tag.Romantic { background: #f8bbd0; color: #880e4f; }
        .empty { text-align: center; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>Наш киновечер 💖</h2>
    
    <div class="input-group">
        <input type="text" id="movieInput" placeholder="Введите название фильма...">
        <button onclick="addMovie()">Добавить</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('all', this)">Все</button>
        <button class="tab-btn" onclick="switchTab('Cozy', this)">Уютные ☕</button>
        <button class="tab-btn" onclick="switchTab('Tense', this)">Напряженные 🔥</button>
        <button class="tab-btn" onclick="switchTab('Romantic', this)">Романтичные ❤️</button>
    </div>

    <div id="movieList" class="movie-list"><div class="empty">Загрузка фильмов...</div></div>

<script>
    
    const SUPABASE_URL = 'https://moxqacnbytsoicvbztuz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_L0koDgGgN_EPAv4_QF1xvg_rt9NQUM7';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TMDB_API_KEY = 'ВАШ_TMDB_API_KEY'; 
    let movies = [];
    let currentTab = 'all';

    async function fetchMovies() {
        const { data, error } = await supabase.from('movies').select('*').order('created_at', { ascending: false });
        if (error) {
            console.error('Ошибка загрузки:', error);
        } else {
            movies = data || [];
            renderMovies();
        }
    }

    async function addMovie() {
        const input = document.getElementById('movieInput');
        const query = input.value.trim();
        if (!query) return;

        let mood = 'Cozy';
        let title = query;

        try {
            const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=ru-RU`);
            const data = await res.json();
            if (data.results && data.results.length > 0) {
                const m = data.results[0];
                title = m.title;
                mood = detectMood(m.genre_ids);
            }
        } catch (e) {
            console.log('Не удалось подключить TMDb, сохраняем базово');
        }

        const { error } = await supabase.from('movies').insert([{ title, mood, watched: false }]);
        if (error) {
            alert('Ошибка при добавлении в базу!');
            console.error(error);
        } else {
            input.value = '';
            fetchMovies();
        }
    }

    function detectMood(genreIds) {
        if (genreIds.includes(10749) || genreIds.includes(35)) return 'Romantic';
        if (genreIds.includes(53) || genreIds.includes(28) || genreIds.includes(27)) return 'Tense';
        return 'Cozy';
    }

    async function toggleWatched(id, currentStatus) {
        await supabase.from('movies').update({ watched: !currentStatus }).eq('id', id);
        fetchMovies();
    }

    async function deleteMovie(id) {
        await supabase.from('movies').delete().eq('id', id);
        fetchMovies();
    }

    function renderMovies() {
        const listContainer = document.getElementById('movieList');
        listContainer.innerHTML = '';

        const filtered = currentTab === 'all' ? movies : movies.filter(m => m.mood === currentTab);

        if (filtered.length === 0) {
            listContainer.innerHTML = '<p class="empty">Здесь пока пусто ✨</p>';
            return;
        }

        filtered.forEach(movie => {
            const item = document.createElement('div');
            item.className = `movie-item ${movie.watched ? 'watched' : ''}`;
            item.innerHTML = `
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1;">
                    <input type="checkbox" ${movie.watched ? 'checked' : ''} onclick="toggleWatched('${movie.id}', ${movie.watched})">
                    <span class="title">${movie.title}</span>
                </label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="tag ${movie.mood}">${getMoodName(movie.mood)}</span>
                    <button onclick="deleteMovie('${movie.id}')" style="background: transparent; color: #ff5252; padding: 2px 6px; font-size: 14px;" title="Удалить">✕</button>
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    function getMoodName(mood) {
        return { Cozy: 'Уютный ☕', Tense: 'Напряженный 🔥', Romantic: 'Романтичный ❤️' }[mood] || 'Другое';
    }

    function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMovies();
    }

    // Загружаем при старте
    fetchMovies();
</script>

</body>
</html>
