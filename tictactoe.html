<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff4b6e;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 10px 18px;
            border-radius: 50px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(255, 75, 110, 0.1);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 1);
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 25px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(255, 75, 110, 0.15);
            max-width: 95%;
            width: 380px;
            z-index: 10;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            color: #4a4a4a;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .status {
            font-size: 16px;
            color: #ff4b6e;
            font-weight: 600;
            margin-bottom: 25px;
            height: 24px;
        }

       
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .cell {
            background: white;
            height: 90px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.08);
            border: 2px solid #ffc2d1;
            transition: transform 0.15s, background 0.2s;
            user-select: none;
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.x {
            color: #ff4b6e;
        }

        .cell.o {
            color: #0088cc;
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff4b6e 0%, #ff2a55 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.4);
            transition: transform 0.2s;
        }

        .btn-reset:hover {
            transform: scale(1.03);
        }

      
        #winModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .win-box {
            background: white;
            padding: 40px 30px;
            border-radius: 28px;
            text-align: center;
            max-width: 90%;
            width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .win-box h2 {
            color: #ff4b6e;
            margin-bottom: 15px;
            font-size: 26px;
        }

        .win-box p {
            color: #444;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← Назад</a>

    <div class="card">
        <h1>Крестики-нолики ❌⭕</h1>
        <div class="status" id="status">Ходят крестики (❌)</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button class="btn-reset" onclick="resetGame()">Сбросить игру</button>
    </div>

    
    <div id="winModal">
        <div class="win-box">
            <h2 id="winTitle">Победа! 🎉</h2>
            <p id="winText">Ура! Эта партия за вами!</p>
            <button class="btn-reset" onclick="closeModal()">Играть снова</button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const winModal = document.getElementById('winModal');
        const winTitle = document.getElementById('winTitle');
        const winText = document.getElementById('winText');

        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X'; 
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], 
            [0, 3, 6], [1, 4, 7], [2, 5, 8], 
            [0, 4, 8], [2, 4, 6]             
        ];

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (board[clickedCellIndex] !== '' || !isGameActive) {
                return;
            }

            board[clickedCellIndex] = currentPlayer;
            clickedCell.innerText = currentPlayer === 'X' ? '❌' : '⭕';
            clickedCell.classList.add(currentPlayer.toLowerCase());

            checkResultValidation();
        }

        function checkResultValidation() {
            let roundWon = false;
            let winningMessage = '';

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                winTitle.innerText = currentPlayer === 'X' ? "Крестики победили! 🎉" : "Нолики победили! 🎉";
                winText.innerText = currentPlayer === 'X' ? "Отличная стратегия! С тебя порция обнимашек ❤️" : "Красивая игра! С тебя порция обнимашек ❤️";
                winModal.style.display = 'flex';
                isGameActive = false;
                return;
            }

            let roundDraw = !board.includes('');
            if (roundDraw) {
                winTitle.innerText = "Ничья! 🤝";
                winText.innerText = "Победила любовь! Сыграем еще разок? 😉";
                winModal.style.display = 'flex';
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusElement.innerText = currentPlayer === 'X' ? 'Ходят крестики (❌)' : 'Ходят нолики (⭕)';
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'X';
            statusElement.innerText = 'Ходят крестики (❌)';
            document.querySelectorAll('.cell').forEach(cell => {
                cell.innerText = '';
                cell.classList.remove('x', 'o');
            });
        }

        function closeModal() {
            winModal.style.display = 'none';
            resetGame();
        }

        boardElement.addEventListener('click', handleCellClick);
    </script>
</body>
</html>
