<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта поцелуев</title>
    <style>
        :root {
            --bg-color: #18181b;
            --card-bg: #27272a;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-base: #f43f5e;
            --accent-hover: #e11d48;
            --glow-color: rgba(244, 63, 94, 0.6);
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            text-align: center;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 400;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        #body-svg {
            width: 100%;
            max-height: 400px;
            cursor: pointer;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .zone-group path,
        .zone-group ellipse {
            fill: #3f3f46;
            transition: fill 0.4s ease, filter 0.3s ease;
            outline: none;
            stroke: #52525b;
            stroke-width: 0.5;
            stroke-opacity: 0.5;
        }

        .zone-group path:hover {
            filter: brightness(1.2);
            stroke-width: 1;
            stroke-opacity: 1;
        }

        .zone-group path.kissed-1,
        .zone-group ellipse.kissed-1 {
            fill: var(--accent-base);
            opacity: 0.4;
        }

        .zone-group path.kissed-2,
        .zone-group ellipse.kissed-2 {
            fill: var(--accent-base);
            opacity: 0.7;
        }

        .zone-group path.kissed-3,
        .zone-group ellipse.kissed-3 {
            fill: var(--accent-base);
            opacity: 1.0;
            filter: drop-shadow(0 0 8px var(--glow-color));
        }

        .stats {
            margin-top: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-base);
            text-align: center;
            background: rgba(244, 63, 94, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            min-width: 150px;
        }

        .controls {
            margin-top: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        button {
            background-color: var(--accent-base);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.15s ease;
            box-shadow: 0 4px 15px var(--glow-color);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0px);
            box-shadow: 0 2px 10px var(--glow-color);
        }

        .floating-heart {
            position: absolute;
            color: var(--accent-base);
            font-size: 24px;
            pointer-events: none;
            animation: floatUpAndDrift 1.8s ease-out forwards;
            z-index: 10;
            filter: drop-shadow(0 0 4px white);
        }

        @keyframes floatUpAndDrift {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5) rotate(0deg);
            }
            20% {
                opacity: 1;
                transform: translateY(-15px) scale(1.2) rotate(-5deg);
            }
            50% {
                opacity: 1;
                transform: translateY(-40px) scale(1) rotate(5deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.8) rotate(0deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Карта желаний</h1>
        <p class="subtitle">Отметьте место поцелуя. Больше кликов — сильнее цвет.</p>

        <svg viewBox="0 0 300 600" id="body-svg" preserveAspectRatio="xMidYMid meet">
            <defs>
                <g id="female-silhouette">
                    <path class="zone" d="M150,15 C130,15 115,30 115,50 S135,85 150,85 S185,70 185,50 S170,15 150,15 Z" data-name="Лицо" />
                    <path class="zone" d="M135,88 C135,88 130,95 130,105 L145,105 L145,95 Z" data-name="Шея слева" />
                    <path class="zone" d="M165,88 C165,88 170,95 170,105 L155,105 L155,95 Z" data-name="Шея справа" />
                    
                    <path class="zone" d="M115,108 L115,118 L95,140 L90,130 Z" data-name="Левое плечо" />
                    <path class="zone" d="M185,108 L185,118 L205,140 L210,130 Z" data-name="Правое плечо" />
                    
                    <path class="zone" d="M130,108 L170,108 L175,140 L150,155 L125,140 Z" data-name="Верхняя часть груди" />
                    <path class="zone" d="M125,140 L150,155 L150,200 L110,190 Z" data-name="Левая грудь" />
                    <path class="zone" d="M175,140 L150,155 L150,200 L190,190 Z" data-name="Правая грудь" />
                    <path class="zone" d="M110,190 L150,200 L150,240 L115,230 Z" data-name="Левый бок" />
                    <path class="zone" d="M190,190 L150,200 L150,240 L185,230 Z" data-name="Правый бок" />
                    
                    <ellipse class="zone" cx="150" cy="270" rx="30" ry="45" data-name="Живот" />
                    
                    <path class="zone" d="M138,320 L162,320 L158,350 L142,350 Z" data-name="Самое сокровенное" />

                    <!-- Левая нога (6 частей) -->
                    <path class="zone" d="M115,230 L135,240 L135,330 L110,320 Z" data-name="Левое бедро верх" />
                    <path class="zone" d="M135,240 L150,248 L150,340 L135,330 Z" data-name="Левое бедро центр" />
                    <path class="zone" d="M135,330 L150,340 L148,375 L132,370 Z" data-name="Левое колено" />
                    <path class="zone" d="M132,370 L148,375 L145,480 L130,470 Z" data-name="Левая икра верх" />
                    <path class="zone" d="M130,470 L145,480 L142,560 L128,550 Z" data-name="Левая икра низ" />
                    <path class="zone" d="M128,550 L142,560 L140,590 L120,585 Z" data-name="Левая стопа" />

                    <!-- Правая нога (6 частей) -->
                    <path class="zone" d="M185,230 L165,240 L165,330 L190,320 Z" data-name="Правое бедро верх" />
                    <path class="zone" d="M165,240 L150,248 L150,340 L165,330 Z" data-name="Правое бедро центр" />
                    <path class="zone" d="M165,330 L150,340 L152,375 L168,370 Z" data-name="Правое колено" />
                    <path class="zone" d="M168,370 L152,375 L155,480 L170,470 Z" data-name="Правая икра верх" />
                    <path class="zone" d="M170,470 L155,480 L158,560 L172,550 Z" data-name="Правая икра низ" />
                    <path class="zone" d="M172,550 L158,560 L160,590 L180,585 Z" data-name="Правая стопа" />
                </g>
            </defs>
            
            <use href="#female-silhouette" class="zone-group"/>
        </svg>

        <div class="stats">Поцелуев нанесено: <span id="counter">0</span></div>

        <div class="controls">
            <button id="reset-btn">Очистить карту</button>
        </div>
    </div>

    <script>
        const zones = document.querySelectorAll('.zone-group .zone');
        const counterElem = document.getElementById('counter');
        const resetBtn = document.getElementById('reset-btn');
        const container = document.querySelector('.container');

        const intensityLevels = ['kissed-1', 'kissed-2', 'kissed-3'];
        let totalKisses = 0;

        zones.forEach(zone => {
            zone.addEventListener('click', (e) => {
                let currentLevel = parseInt(zone.getAttribute('data-kiss-level')) || 0;

                if (currentLevel < intensityLevels.length) {
                    if (currentLevel > 0) {
                        zone.classList.remove(intensityLevels[currentLevel - 1]);
                    }
                    
                    currentLevel++;
                    zone.setAttribute('data-kiss-level', currentLevel);
                    zone.classList.add(intensityLevels[currentLevel - 1]);
                    
                    totalKisses++;
                    counterElem.textContent = totalKisses;
                }

                createFloatingHeart(e.clientX, e.clientY);
            });
        });

        resetBtn.addEventListener('click', () => {
            zones.forEach(zone => {
                intensityLevels.forEach(className => zone.classList.remove(className));
                zone.removeAttribute('data-kiss-level');
            });
            totalKisses = 0;
            counterElem.textContent = totalKisses;
        });

        function createFloatingHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            
            const rect = container.getBoundingClientRect();
            heart.style.left = (x - rect.left) + 'px';
            heart.style.top = (y - rect.top) + 'px';
            
            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1800);
        }
    </script>
</body>
</html>
