<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта желаний</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e22;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-base: #f43f5e;
            --accent-hover: #e11d48;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; 
            touch-action: none; 
        }

        .container {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            text-align: center;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 400;
            line-height: 1.4;
            max-width: 300px;
        }

       
        .drawing-area {
            position: relative;
            width: 300px;
            height: 480px;
            background-color: #17171a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

       
        #silhouette-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            opacity: 0.7;
        }

       
        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 10;
        }

        button {
            background-color: var(--accent-base);
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.6);
        }

        button:active {
            transform: translateY(0px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Карта желаний</h1>
        <p class="subtitle">Рисуй там, где хочешь оставить свои прикосновения. Просто проведи пальцем.</p>

        <div class="drawing-area">
            
            <svg viewBox="0 0 300 480" id="silhouette-svg">
                <g fill="none" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                       <ellipse cx="150" cy="55" rx="16" ry="22" />
                    <path d="M 143 76 L 143 90 M 157 76 L 157 90" />
                    
                    <path d="M 143 90 Q 110 88 95 120 Q 85 160 90 220" />
                    <path d="M 157 90 Q 190 88 205 120 Q 215 160 210 220" />
                    
                    <path d="M 125 105 Q 150 120 175 105" />
                    
                    <path d="M 115 120 Q 145 150 128 200 Q 115 240 115 280 Q 120 330 135 480" />
                    <path d="M 185 120 Q 155 150 172 200 Q 185 240 185 280 Q 180 330 165 480" />
                  
                    <path d="M 118 150 Q 135 175 150 155" />
                    <path d="M 182 150 Q 165 175 150 155" />
                    
                    <circle cx="150" cy="255" r="1" fill="#d1d5db" stroke="none"/>
                    
                    <path d="M 140 310 Q 150 330 160 310" />
                    <path d="M 145 320 L 138 480" />
                    <path d="M 155 320 L 162 480" />
                </g>
            </svg>

           
            <canvas id="drawing-canvas" width="300" height="480"></canvas>
        </div>

        <button id="reset-btn">
            ✨ Обнулить карту
        </button>
    </div>

    <script>
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('reset-btn');

        // Настройки кисти
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.lineWidth = 30; 
        ctx.shadowBlur = 15; 
        ctx.shadowColor = 'rgba(255, 71, 126, 0.4)'; 
        ctx.strokeStyle = 'rgba(255, 71, 126, 0.08)'; 

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        
        function startDrawing(e) {
            isDrawing = true;
            const pos = getCoordinates(e);
            lastX = pos.x;
            lastY = pos.y;
            
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(lastX, lastY);
            ctx.stroke();
        }

        
        function draw(e) {
            if (!isDrawing) return;
            // e.preventDefault() 
            if(e.cancelable) e.preventDefault(); 
            
            const pos = getCoordinates(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            lastX = pos.x;
            lastY = pos.y;
        }

        
        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath(); 
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);

        
        resetBtn.addEventListener('click', () => {
            
            canvas.style.transition = 'opacity 0.3s ease';
            canvas.style.opacity = '0';
            
            setTimeout(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.style.opacity = '1';
            }, 300);
        });
    </script>
</body>
</html>
