<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест на совместимость</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .player-indicator {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .question {
            font-size: 1.2em;
            color: #444;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button.btn-option {
            background: #f0f2f5;
            border: 2px solid transparent;
            padding: 14px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            text-align: left;
            transition: all 0.2s ease;
        }

        button.btn-option:hover {
            background: #e4e6eb;
            border-color: #764ba2;
        }

        .btn-start {
            background: #764ba2;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-start:hover {
            background: #5a377d;
        }

        .hidden {
            display: none;
        }

        .result-title {
            font-size: 1.8em;
            color: #764ba2;
            margin-bottom: 15px;
        }

        .result-text {
            font-size: 1.1em;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <div id="start-screen">
        <h1>💞 Тест на совместимость</h1>
        <p>Пройдите тест вместе на одном устройстве! Сначала отвечает Игрок 1, затем Игрок 2.</p>
        <button class="btn-start" onclick="startQuiz()">Начать тест</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="player-indicator" id="player-indicator">Игрок 1</div>
        <div class="question" id="question-text">Загрузка вопроса...</div>
        <div class="options" id="options-container"></div>
    </div>

    <div id="turn-screen" class="hidden">
        <h2>📱 Передайте устройство!</h2>
        <p>Теперь очередь <b>Игрока 2</b> отвечать на те же вопросы.</p>
        <button class="btn-start" onclick="startPlayer2()">Я готов(а)</button>
    </div>

    <div id="result-screen" class="hidden">
        <div class="result-title" id="result-title"></div>
        <div class="result-text" id="result-text"></div>
        <br>
        <button class="btn-start" onclick="restartQuiz()">Пройти снова</button>
    </div>
</div>

<script>
    const questions = [
        {
            text: "1. Идеальный вечер пятницы — это...",
            options: [
                "Потусить в шумной компании",
                "Посмотреть фильм дома с вкусняшками",
                "Поиграть в игры до ночи"
            ]
        },
        {
            text: "2. Если у вас неожиданно появились свободные деньги, вы скорее...",
            options: [
                "Отложите на что-то крупное",
                "Потратите на впечатления (поездку, кафе)",
                "Купите классную вещь, о которой мечтали"
            ]
        },
        {
            text: "3. Как вы относитесь к спонтанным планам?",
            options: [
                "Обожаю! Чем неожиданнее, тем круче",
                "Нормально, но лучше планировать",
                "Не люблю, комфортнее по порядку"
            ]
        },
        {
            text: "4. Как вы решаете мелкие разногласия?",
            options: [
                "Обсуждаем сразу «на месте»",
                "Нужно немного остыть, а потом поговорить",
                "Переводим всё в шутку и забываем"
            ]
        },
        {
            text: "5. Какая суперсила вам ближе?",
            options: [
                "Умение читать мысли",
                "Телепортация в любую точку",
                "Умение останавливать время"
            ]
        }
    ];

    let currentPlayer = 1;
    let currentQuestionIndex = 0;
    let p1Answers = [];
    let p2Answers = [];

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById('player-indicator').innerText = `Ход: Игрок ${currentPlayer}`;
        document.getElementById('question-text').innerText = q.text;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(index) {
        if (currentPlayer === 1) {
            p1Answers.push(index);
        } else {
            p2Answers.push(index);
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            if (currentPlayer === 1) {
                // Игрок 1 закончил, передаем ход Игроку 2
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('turn-screen').classList.remove('hidden');
            } else {
                // Оба закончили, показываем результат
                showResults();
            }
        }
    }

    function startPlayer2() {
        currentPlayer = 2;
        currentQuestionIndex = 0;
        document.getElementById('turn-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showResults() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let matches = 0;
        for (let i = 0; i < questions.length; i++) {
            if (p1Answers[i] === p2Answers[i]) {
                matches++;
            }
        }

        const titleEl = document.getElementById('result-title');
        const textEl = document.getElementById('result-text');

        if (matches === 5) {
            titleEl.innerText = "⚡ 100% Мэтч!";
            textEl.innerText = `У вас совпали абсолютно все ответы (${matches} из 5)! Вы будто читаете мысли друг друга.`;
        } else if (matches >= 3) {
            titleEl.innerText = "⚖️ Отличный баланс!";
            textEl.innerText = `Совпадений: ${matches} из 5. У вас очень много общего, но каждый сохраняет свою индивидуальность!`;
        } else {
            titleEl.innerText = "🧲 Противоположности притягиваются!";
            textEl.innerText = `Совпадений: ${matches} из 5. Вы очень разные, и это круто — вам всегда будет чем удивить друг друга!`;
        }
    }

    function restartQuiz() {
        currentPlayer = 1;
        currentQuestionIndex = 0;
        p1Answers = [];
        p2Answers = [];
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
