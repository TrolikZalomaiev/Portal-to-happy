<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценка симпатии ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff4b6e;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 10px 18px;
            border-radius: 50px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(255, 75, 110, 0.1);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 1);
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(255, 75, 110, 0.15);
            max-width: 95%;
            width: 440px;
            z-index: 10;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            color: #4a4a4a;
            font-size: 24px;
            margin-bottom: 8px;
            line-height: 1.4;
            font-weight: 700;
        }

        .accent {
            color: #ff4b6e;
        }

        p.hint {
            font-size: 15px;
            color: #777;
            margin-bottom: 30px;
        }

        
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            justify-content: center;
        }

        
        .num-btn {
            background: white;
            color: #ff4b6e;
            border: 2px solid #ffc2d1;
            padding: 14px 0;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.08);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s, color 0.2s, opacity 0.3s;
            position: relative;
        }

        .num-btn:hover {
            background: #ffe5ec;
            border-color: #ff4b6e;
            transform: translateY(-3px);
        }

        
        .num-btn.special {
            background: linear-gradient(135deg, #ff4b6e 0%, #ff2a55 100%);
            color: white;
            border: none;
            box-shadow: 0 6px 20px rgba(255, 75, 110, 0.4);
        }

        .num-btn.special:hover {
            transform: translateY(-3px) scale(1.05);
            background: linear-gradient(135deg, #ff2a55 0%, #e01e43 100%);
        }

                #winModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .win-box {
            background: white;
            padding: 40px 30px;
            border-radius: 28px;
            text-align: center;
            max-width: 90%;
            width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .win-box h2 {
            color: #ff4b6e;
            margin-bottom: 15px;
            font-size: 26px;
        }

        .win-box p {
            color: #444;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-restart {
            background: linear-gradient(135deg, #ff4b6e 0%, #ff2a55 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 75, 110, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-restart:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(255, 75, 110, 0.5);
        }

        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← Назад</a>

    <div class="card">
        <h1>Насколько я тебе нравлюсь? <br><span class="accent">Оцени от 1 до 10 👀</span></h1>
        <p class="hint">Выбери честную оценку :)</p>

        <div class="numbers-grid" id="grid">
                    </div>
    </div>

   
    <div id="winModal">
        <div class="win-box">
            <h2 id="winTitle">Превосходно! 🥰</h2>
            <p id="winText">Хочу что бы ты знала, что это взаимно!❤️</p>
            <button class="btn-restart" onclick="resetPage()">Пройти заново</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const winModal = document.getElementById('winModal');
        const winTitle = document.getElementById('winTitle');
        const winText = document.getElementById('winText');

               for (let i = 1; i <= 10; i++) {
            let btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = i;

            if (i === 9 || i === 10) {
                btn.classList.add('special');
                btn.addEventListener('click', () => {
                    if (i === 10) {
                        winTitle.innerText = "Максимальный балл! 🏆";
                        winText.innerText = "10 из 10! Обожаю тебя, ты у меня самая лучшая! ❤️";
                    } else {
                        winTitle.innerText = "Нууууууу..! ✨";
                        winText.innerText = "9 из 10 тоже нормальный результат конечно!🥰";
                    }
                    winModal.style.display = 'flex';
                });
            } else {
                let escapeCount = 0;
                
                const escapeAction = (e) => {
                    e.preventDefault();
                    escapeCount++;

                    if (escapeCount < 3) {
                        let randomX = (Math.random() - 0.5) * 220;
                        let randomY = (Math.random() - 0.5) * 220;
                        btn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${1 - escapeCount * 0.15})`;
                    } else {
                        btn.style.transform = `translate(${Math.random() * 300 - 150}px, ${Math.random() * 300 - 150}px) scale(0)`;
                        btn.style.opacity = '0';
                        setTimeout(() => {
                            btn.style.display = 'none';
                        }, 300);
                    }
                };

                btn.addEventListener('mouseover', escapeAction);
                btn.addEventListener('click', escapeAction);
                btn.addEventListener('touchstart', escapeAction);
            }

            grid.appendChild(btn);
        }

        function resetPage() {
            location.reload();
        }
    </script>
</body>
</html>
