<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 75, 110, 0.15);
            max-width: 90%;
            width: 420px;
            animation: fadeIn 1.5s ease-out;
            margin: auto;
        }

        .heart {
            font-size: 60px;
            color: #ff4b6e;
            margin-bottom: 20px;
            display: inline-block;
            animation: heartbeat 1.2s infinite ease-in-out;
        }

        h1 {
            font-size: 26px;
            color: #4a4a4a;
            line-height: 1.5;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .accent {
            color: #ff4b6e;
            display: block;
            margin-top: 10px;
            font-weight: 700;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px; 
            width: 100%;
        }

        .btn-menu {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff4b6e 0%, #ff2a55 100%);
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 5px 20px rgba(255, 75, 110, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        .btn-menu:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 75, 110, 0.5);
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.12); }
            28% { transform: scale(1); }
            42% { transform: scale(1.12); }
            70% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    
    <div id="authScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%); display: flex; justify-content: center; align-items: center; z-index: 99999; font-family: sans-serif;">
        <div style="background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 300px;">
            <h2 style="color: #4a4a4a; margin-bottom: 15px;">Введите пароль ❤️</h2>
            <input type="password" id="passInput" style="width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ffc2d1; margin-bottom: 15px; text-align: center;" onkeydown="if(event.key === 'Enter') checkPassword()">
            <button onclick="checkPassword()" style="width: 100%; background: #ff4b6e; color: white; border: none; padding: 10px; border-radius: 50px; font-weight: bold; cursor: pointer;">Войти</button>
        </div>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('passInput').value;

            if (pass === '2806') {
                document.getElementById('authScreen').style.display = 'none';
            } else {
                alert('Неверный пароль!');
                document.getElementById('passInput').value = '';
            }
        }
    </script>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>Обожаю тебя <br><span class="accent">Спасибо, что делаешь меня счастливым❣️</span></h1>
        
        <div class="buttons-container">
            <a href="gallery.html" class="btn-menu">Наши фото ✨</a>
            <a href="question.html" class="btn-menu">Важный вопрос 👀</a>
            <a href="lottery.html" class="btn-menu">Твои призы 🎟️</a>
            <a href="magic.html" class="btn-menu">Шар комплиментов 🔮</a>
            <a href="game.html" class="btn-menu">Поймай сердечко ❤️</a>
            <a href="rate.html" class="btn-menu">Оценка симпатии ⭐</a>
            <a href="tictactoe.html" class="btn-menu">Крестики-нолики ❌⭕</a>
            <a href="kisses.html" class="btn-menu">Заказ поцелуев 😘😘</a>
            <a href="movies.html" class="btn-menu">Наш киновечер⭐✨😘</a>
            <a href="notes.html" class="btn-menu">Что я хочу тебе сказать♥️🫣</a>
            <a href="test.html" class="btn-menu"> Насколько мы совместимы💕</a>
        </div>
    </div>

</body>
</html>
